services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: longaeva
      POSTGRES_PASSWORD: longaeva
      POSTGRES_DB: longaeva
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - longaeva_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longaeva -d longaeva"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://longaeva:longaeva@db:5432/longaeva
      ARTIFACT_DIR: /srv/longaeva/var/artifacts
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WORKER_ID: api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/srv/longaeva/data:ro
      - ./docs:/srv/longaeva/docs:ro
      - longaeva_artifacts:/srv/longaeva/var/artifacts
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        alembic upgrade head
        exec uvicorn longaeva_app.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://longaeva:longaeva@db:5432/longaeva
      ARTIFACT_DIR: /srv/longaeva/var/artifacts
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WORKER_ID: worker-1
      WORKER_POLL_INTERVAL_SEC: "1.0"
      WORKER_HEARTBEAT_PATH: /tmp/longaeva-worker-heartbeat
    volumes:
      - ./data:/srv/longaeva/data:ro
      - longaeva_artifacts:/srv/longaeva/var/artifacts
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "longaeva_app.worker.loop"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; from longaeva_app.worker.healthcheck import check_heartbeat_cli; raise SystemExit(check_heartbeat_cli(Path('/tmp/longaeva-worker-heartbeat'), 15.0))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  longaeva_pg:
  longaeva_artifacts:
