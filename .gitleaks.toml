title = "Talisman gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "Public data-series and frontend metric identifiers misclassified as generic API keys"
    regexes = [
        '''^(historical_1y|stabilized_10d|pct_above_200dma|pct_above_20dma|pct_below_50dma|tickers_below_50dma|tickers_3plus_dist|pct_broke_20low|tickers_broke_20low|Pct_Above_200DMA|JPN\.B1_GE\.GYSA\.Q)$''',
    ]

    [[rules.allowlists]]
    description = "Synthetic Gemini API key used in tests"
    regexes = [
        '''^AIza-test-key-12345678901234567890$''',
    ]

    [[rules.allowlists]]
    description = "Exact reviewed public identifiers at exact historical paths; reviewed 2026-10-14, expires 2027-01-12"
    condition = "AND"
    paths = [
        '''^api/llm_settings\.py$''',
    ]
    regexes = [
        '''^llm\.reasoning_effort\.frontier_defaults_v2$''',
    ]

    [[rules.allowlists]]
    description = "Exact reviewed public identifiers at exact historical paths; reviewed 2026-10-14, expires 2027-01-12"
    condition = "AND"
    paths = [
        '''^longaeva/backend/longaeva_app/extract/census_marts\.py$''',
        '''^longaeva/backend/tests/test_census_marts\.py$''',
        '''^longaeva/docs/gates/census\.md$''',
