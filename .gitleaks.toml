title = "Talisman gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "Public data-series and frontend metric identifiers misclassified as generic API keys"
    regexes = [
        '''^(historical_1y|stabilized_10d|pct_above_200dma|pct_above_20dma|pct_below_50dma|tickers_below_50dma|tickers_3plus_dist|pct_broke_20low|tickers_broke_20low|Pct_Above_200DMA|JPN\.B1_GE\.GYSA\.Q)$''',
    ]

    [[rules.allowlists]]
    description = "Synthetic Gemini API key used in tests"
    regexes = [
        '''^AIza-test-key-12345678901234567890$''',
    ]

    [[rules.allowlists]]
    description = "Public settings migration identifier (reviewed 2026-10-14; recheck by 2027-01-12)"
    condition = "AND"
    paths = ['''^api/llm_settings\.py$''']
    regexes = ['''^llm\.reasoning_effort\.frontier_defaults_v2$''']

    [[rules.allowlists]]
    description = "Exact public financial series identifiers in historical Longaeva fixtures (reviewed 2026-10-14; recheck by 2027-01-12)"
    condition = "AND"
    paths = ['''^longaeva/(data/.*\.json|backend/longaeva_app/extract/census_marts\.py|backend/tests/test_census_marts\.py|docs/gates/census\.md)$''']
    regexes = [
        '''^(bkng_2024q1_ceo_qualitative|bkng_2025q4_qtd_demand_qualitative|cost_2024q3_ecommerce_comp_yoy|cost_2024q3_ticket_yoy|cost_2025q4_ecommerce_comp_yoy|cost_2025q4_ticket_yoy|growth_q_minus_1_nominal|naics_452_dept|pv_nine_month_mar_2023|pv_nine_month_mar_2024|pv_year_ago_q_minus_1|pypl_2024q1_tpv_fxn_yoy|pypl_2025_raises_fy_guidance|pypl_2025q3_tpv_fxn_yoy|ual_2024q2_atlantic_passenger_revenue_yoy|ual_2024q2_capacity_yoy|ual_2024q2_premium_qualitative|ual_2025q3_atlantic_expansion_qualitative|ual_2025q3_atlantic_passenger_revenue_yoy|ual_2025q3_capacity_yoy)$''',
    ]

    [[rules.allowlists]]
    description = "SHA-256 request cache fingerprints in historical LLM evaluation fixtures (reviewed 2026-10-14; recheck by 2027-01-12)"
    condition = "AND"
    paths = ['''^longaeva/data/(evaluation/visa_llm_baseline|fixtures/llm_baseline/(cached|schema-validation-rejected|[0-9]{4}-[0-9]{2}-[0-9]{2}))\.json$''']
    regexTarget = "match"
    regexes = ['''^request_key["']?\s*[:=]\s*["'][0-9a-f]{64}["']$''']

    [[rules.allowlists]]
    description = "Public mock-provider argument name misparsed after a synthetic test-key literal (reviewed 2026-10-14; recheck by 2027-01-12)"
    condition = "AND"
    paths = ['''^(longaeva/backend/tests/test_llm_baseline|scripts/check_gitleaks_allowlists)\.py$''']
    regexes = ['''^anthropic_api_key=$''']
